# Generated by GHAV from .github/workflows/ci.yml
name: CI
'on':
  push:
  pull_request:
jobs:
  checks-build:
    name: checks / Build
    needs:
      - prep
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
  checks-test:
    name: checks / test
    needs:
      - checks-build
      - prep
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node:
          - 20
          - 22
    steps:
      - run: npm test -- --node=${{ matrix.node }}
      - run: echo "${{ needs.checks-build.result }}"
  prep:
    runs-on: ubuntu-latest
    steps:
      - run: echo prep
