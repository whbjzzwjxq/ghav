[project]
name = "ghav"
version = "0.1.0"
description = "GHAV: rule-free verified optimization of GitHub Actions workflows"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "z3-solver>=4.12",
]

[project.scripts]
ghav = "ghav.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
