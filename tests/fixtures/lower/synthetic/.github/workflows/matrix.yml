# Matrix expansion cases taken from the GitHub documentation
# ("Running variations of jobs in a workflow"), plus typed values.
name: Matrix
on: [push, pull_request]
jobs:
  docs-include:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fruit: [apple, pear]
        animal: [cat, dog]
        include:
          - color: green
          - color: pink
            animal: cat
          - fruit: apple
            shape: circle
          - fruit: banana
          - fruit: banana
            animal: cat
    steps:
      - run: echo ${{ matrix.fruit }} ${{ matrix.color }} ${{ matrix.shape }}

  docs-exclude:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        version: [12, 14, 16]
        environment: [staging, production]
        exclude:
          - os: macos-latest
            version: 12
            environment: production
          - os: windows-latest
            version: 16
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

  typed:
    name: Typed ${{ matrix.experimental }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        experimental: [true, false]
        py: ['3.10', 3.10]
        word: [yes]
    steps:
      - if: matrix.experimental
        run: echo experimental
      - if: ${{ matrix.py == '3.1' }}
        run: echo float
      - run: echo ${{ matrix.word }}

  named:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [a, b]
    steps:
      - run: echo ${{ matrix.target }}
