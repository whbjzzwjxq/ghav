# Generated by GHAV from .github/workflows/ci.yml
name: CI
'on':
  push:
    branches:
      - main
  pull_request:
env:
  CI: 'true'
defaults:
  run:
    shell: bash
jobs:
  deploy:
    needs:
      - test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm publish
  ghav-build:
    name: ghav build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        run: npm run build
        shell: bash
      - name: 'ghav: pack ghav-0f0f'
        run: tar -cf "$RUNNER_TEMP/ghav-0f0f.tar" -C "$GITHUB_WORKSPACE" dist
        shell: bash
      - name: 'ghav: upload ghav-0f0f'
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ghav-0f0f
          path: ${{ runner.temp }}/ghav-0f0f.tar
          retention-days: '1'
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Lint
        if: github.event_name == 'pull_request'
        run: npm run lint
  test:
    needs:
      - ghav-build
      - lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 18
          - 20
        exclude:
          - os: windows-latest
            node: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: 'ghav: download ghav-0f0f'
        uses: actions/download-artifact@v4
        with:
          name: ghav-0f0f
          path: ${{ runner.temp }}
      - name: 'ghav: unpack ghav-0f0f'
        run: tar -xf "$RUNNER_TEMP/ghav-0f0f.tar" -C "$GITHUB_WORKSPACE" dist
        shell: bash
      - name: Test
        run: |
          npm test -- --ci
          npm run test:types
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: codecov/codecov-action@v4
